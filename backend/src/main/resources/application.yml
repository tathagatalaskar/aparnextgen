server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/apar_db}
    username: ${SPRING_DATASOURCE_USERNAME:apar_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:apar_pass}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: tran

app:
  jwt:
    # Required at startup: configure a unique secret (at least 32 bytes) per environment.
    secret: ${APP_JWT_SECRET}
    expiration-ms: 3600000
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173}
  cron:
    secret: ${CRON_SECRET:}
  scheduler:
    enabled: ${APP_SCHEDULER_ENABLED:true}

logging:
  level:
    root: WARN
    gov.nic.apar: INFO
